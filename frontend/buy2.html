<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Coffee</title>
  <link rel="stylesheet" href="buy.css">
</head>
<body>

  <section class="buy-section">

    <div class="buy-container">

      <h1>Buy Your Coffee</h1>

      <img
        src="images/Latte.jpg"
        alt="Coffee"
      >

      <h2>Latte</h2>

      <p class="price">$6</p>
      

      <form id="orderForm">

        <input
          type="text"
          id="name"
          placeholder="Your Name"
          required
        >
    
        <input
          type="email"
          id="email"
          placeholder="Your Email"
          required
        >

        <input
          type="number"
          id="quantity"
          placeholder="Quantity"
          required
        >

        <button type="submit">
          Buy Now
        </button>

      </form>
      <p id="message"></p>

    </div>


    

  </section>

  <script src="buy2.js"></script>

</body>
</html>
